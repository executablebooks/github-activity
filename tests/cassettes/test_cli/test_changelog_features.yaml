- request:
    body: '{"query": "{\n  search(first: 50, query: \"repo:executablebooks/github-activity
      type:issue created:2025-04-11T22:23:28Z..2025-12-09T16:50:50Z\", type: ISSUE)
      {\n    issueCount\n    pageInfo {\n        endCursor\n        hasNextPage\n    }\n    nodes
      {\n      ... on PullRequest {\n                state\n        id\n        title\n        url\n        createdAt\n        updatedAt\n        closedAt\n        labels(first:
      10) {\n            edges {\n                node {\n                    name\n                }\n            }\n        }\n        number\n        authorAssociation\n        author
      {\n          login\n          __typename\n        }\n        reactions(content:
      THUMBS_UP) {\n          totalCount\n        }\n\n        mergedBy {\n          login\n          __typename\n        }\n        mergeCommit
      {\n          oid\n        }\n        baseRefName\n                comments(last:
      100) {\n          edges {\n            node {\n              authorAssociation\n              createdAt\n              updatedAt\n              url\n              author
      {\n                login\n                __typename\n              }\n            }\n          }\n        }\n\n                commits(first:
      100) {\n          edges {\n            node {\n              commit {\n                committer
      {\n                  user {\n                    login\n                    __typename\n                  }\n                }\n                authors(first:
      10) {\n                  edges {\n                    node {\n                      user
      {\n                        login\n                        __typename\n                      }\n                    }\n                  }\n                }\n              }\n            }\n          }\n        }\n\n                reviews(last:
      100) {\n          edges {\n            node {\n              authorAssociation\n              author
      {\n                login\n                __typename\n              }\n            }\n          }\n        }\n\n      }\n      ...
      on Issue {\n                state\n        id\n        title\n        url\n        createdAt\n        updatedAt\n        closedAt\n        labels(first:
      10) {\n            edges {\n                node {\n                    name\n                }\n            }\n        }\n        number\n        authorAssociation\n        author
      {\n          login\n          __typename\n        }\n        reactions(content:
      THUMBS_UP) {\n          totalCount\n        }\n\n                comments(last:
      100) {\n          edges {\n            node {\n              authorAssociation\n              createdAt\n              updatedAt\n              url\n              author
      {\n                login\n                __typename\n              }\n            }\n          }\n        }\n\n      }\n    }\n  }\n}\n"}'
